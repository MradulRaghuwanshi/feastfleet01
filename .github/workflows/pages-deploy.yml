name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: food-delivery/frontend/package-lock.json
    
    - name: Install and Build
      working-directory: food-delivery/frontend
      run: |
        npm ci --legacy-peer-deps
        npm run build
      env:
        CI: false
        REACT_APP_API_URL: "https://feastfleet-backend-0ozz.onrender.com"
        REACT_APP_RAZORPAY_KEY_ID: "rzp_live_SqTWXCzB7KpMF5"
        REACT_APP_FIREBASE_API_KEY: "AIzaSyAjz7-JdOVMYXHEsb-BOQ0V3MoaGH2Qo_Y"
        REACT_APP_FIREBASE_AUTH_DOMAIN: "feastfleet-54b7e.firebaseapp.com"
        REACT_APP_FIREBASE_DATABASE_URL: "https://feastfleet-54b7e-default-rtdb.asia-southeast1.firebasedatabase.app"
        REACT_APP_FIREBASE_PROJECT_ID: "feastfleet-54b7e"
        REACT_APP_FIREBASE_STORAGE_BUCKET: "feastfleet-54b7e.firebasestorage.app"
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "72016164039"
        REACT_APP_FIREBASE_APP_ID: "1:72016164039:web:f9ff1f82721b3c81c67ae2"
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    - name: Ensure SPA fallback
      working-directory: food-delivery/frontend
      run: |
        touch build/.nojekyll
        cp ../../CNAME build/CNAME
        if [ -f build/index.html ]; then
          cp build/index.html build/404.html
        else
          echo "build/index.html not found; build may have failed" && exit 1
        fi
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './food-delivery/frontend/build'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4


