name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: food-delivery/frontend/package-lock.json
    
    - name: Install and Build
      working-directory: food-delivery/frontend
      run: |
        npm install --legacy-peer-deps
        npm run build
      env:
        PUBLIC_URL: https://feastfleet.tech
        CI: false
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    - name: Ensure SPA fallback
      working-directory: food-delivery/frontend
      run: |
        if [ -f build/index.html ]; then
          cp build/index.html build/404.html
        else
          echo "build/index.html not found; build may have failed" && exit 1
        fi
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './food-delivery/frontend/build'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4


