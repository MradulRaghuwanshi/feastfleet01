[build]
  command = "cd food-delivery/frontend && npm ci && npm run build"
  publish = "food-delivery/frontend/build"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  REACT_APP_API_URL = "https://feastfleet-backend-0ozz.onrender.com"
  REACT_APP_RAZORPAY_KEY_ID = "rzp_live_SqTWXCzB7KpMF5"
