services:
  - type: web
    name: feastfleet-backend
    env: node
    plan: free
    branch: main
    repo: https://github.com/MradulRaghuwanshi/feastfleet01
    buildCommand: cd food-delivery/backend && npm install
    startCommand: cd food-delivery/backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_DATABASE_URL
        scope: all
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        scope: all

  - type: web
    name: feastfleet-frontend
    env: node
    plan: free
    branch: main
    repo: https://github.com/MradulRaghuwanshi/feastfleet01
    buildCommand: cd food-delivery/frontend && npm install && npm run build
    startCommand: cd food-delivery/frontend && npx serve -s build -l 3000
    envVars:
      - key: REACT_APP_API_URL
        value: https://feastfleet-backend.onrender.com
      - key: REACT_APP_FIREBASE_API_KEY
        scope: all
      - key: REACT_APP_FIREBASE_AUTH_DOMAIN
        scope: all
      - key: REACT_APP_FIREBASE_DATABASE_URL
        scope: all
      - key: REACT_APP_FIREBASE_PROJECT_ID
        scope: all
      - key: REACT_APP_FIREBASE_STORAGE_BUCKET
        scope: all
      - key: REACT_APP_FIREBASE_MESSAGING_SENDER_ID
        scope: all
      - key: REACT_APP_FIREBASE_APP_ID
        scope: all
