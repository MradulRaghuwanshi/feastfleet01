services:
  - type: web
    name: feastfleet-backend
    env: node
    plan: free
    branch: main
    repo: https://github.com/MradulRaghuwanshi/feastfleet01
    buildCommand: cd food-delivery/backend && npm install
    startCommand: cd food-delivery/backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_DATABASE_URL
        value: https://feastfleet-54b7e-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        value: ""
      - key: RAZORPAY_KEY_ID
        value: rzp_live_SqTWXCzB7KpMF5
      - key: RAZORPAY_KEY_SECRET
        value: HtPOrDaOAH9HILTG336H7UsN

  - type: web
    name: feastfleet-frontend
    env: node
    plan: free
    branch: main
    repo: https://github.com/MradulRaghuwanshi/feastfleet01
    buildCommand: cd food-delivery/frontend && npm install && npm run build
    startCommand: cd food-delivery/frontend && npm install && npm run build && npx serve -s build -l $PORT
